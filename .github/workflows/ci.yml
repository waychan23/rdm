name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (domain + application)
        run: uv run mypy src/rdm/domain src/rdm/application
      - name: Pytest
        run: uv run pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    env:
      RDM_TEST_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen
      - name: Pytest (PostgreSQL / ParadeDB)
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [web-next]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
      # esbuild needs no postinstall (platform binary is an optional dep);
      # --ignore-scripts also keeps the install independent of build approval.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Type-aware `@typescript-eslint/no-deprecated` gate; any deprecated
      # ADS prop/API fails the build.
      - name: Lint (deprecated APIs)
        run: pnpm lint
      - name: Type-check and build
        run: pnpm build
      - name: Verify the frontend bundle
        run: test -f dist/index.html
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-next-dist
          path: dist

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install Python dependencies
        working-directory: .
        run: uv sync --frozen
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Builds the SPA, boots a throwaway `rdm serve`, and drives the
      # workflow-engine UI specs in Chromium.
      - name: Web e2e (workflow engine)
        run: pnpm e2e
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            web-next/playwright-report
            web-next/e2e/.results
            web-next/e2e/.auth/server.log
            web-next/e2e/.auth/web.log

  package:
    runs-on: ubuntu-latest
    needs: [test, web, web-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Set up Python
        run: uv python install 3.13
      # The wheel is API/CLI only; the frontend bundle is built by the web job
      # and deployed to nginx separately (architecture §17.160).
      - name: Build wheel and assert the frontend is not shipped
        run: |
          uv build --wheel
          python3 -c "import zipfile,glob; w=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names=w.namelist(); assert not any('web-next-dist' in n for n in names); print('wheel is API/CLI only')"
