[project]
name = "rdm"
dynamic = ["version"]
description = "rd-manager — human/agent collaborative R&D work management (MCP + REST API/CLI)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "waychan23", email = "waychan23@hotmail.com" },
]
requires-python = ">=3.13"
keywords = ["mcp", "workflow", "project-management", "fastapi", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Typing :: Typed",
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "fastmcp",
    "typer>=0.12",
    "httpx",
    "python-ulid",
    "python-multipart",
    "argon2-cffi>=25.1.0",
    "cryptography>=43",
    "pyjson5>=2.0.1",
]

[project.urls]
Homepage = "https://github.com/waychan23/rdm"
Repository = "https://github.com/waychan23/rdm"
Issues = "https://github.com/waychan23/rdm/issues"
Changelog = "https://github.com/waychan23/rdm/blob/main/CHANGELOG.md"

[project.scripts]
rdm = "rdm.interfaces.cli.main:app"

[project.optional-dependencies]
# Optional PostgreSQL backend (§17.114). psycopg 3 serves both the async app
# engine and the sync Alembic/doctor engines, so one driver is enough.
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rdm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rdm"]
# The Web UI is deployed separately (Vite build -> nginx, architecture §17.160);
# the wheel is API/CLI only.

# The sdist is an installable source package: backend + tests + legal/README.
# Frontend sources, agent e2e harness, deploy samples and CI config stay in the
# repository and are not part of the PyPI source distribution.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/rdm",
    "tests",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "asgi-lifespan>=2.1.0",
    "psycopg[binary]>=3.2",
    "testcontainers>=4.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is Depends()/Annotated defaults.
"src/rdm/interfaces/**" = ["B008"]
# Typer options also use callable defaults by design.
"src/rdm/interfaces/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rdm.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "rdm.application.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "sqlite_only: test requires the sqlite backend",
    "postgres_only: test requires postgres",
]
