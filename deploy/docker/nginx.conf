# Container deployment: Web UI + reverse proxy for the rdm backend.
# TLS is expected to terminate in front of this container (enterprise LB,
# ingress, or a host-level nginx) — see docs/docker.md.

upstream rdm_backend {
    server rdm:8765;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # --- SPA ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- API ---------------------------------------------------------------
    # Owner recovery is loopback-only by contract; block it at the edge.
    location ^~ /api/v1/local/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://rdm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/stream {
        proxy_pass http://rdm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- MCP ---------------------------------------------------------------
    location /mcp {
        proxy_pass http://rdm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- OAuth discovery ---------------------------------------------------
    location /.well-known/ {
        proxy_pass http://rdm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Transitional legacy OAuth paths ----------------------------------
    location ~ ^/(authorize|token|register|revoke)$ {
        proxy_pass http://rdm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
