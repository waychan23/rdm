# rdm: Web UI + API on one origin (architecture §17.160).
#
#   Web (SPA)  -> /srv/rdm/web-next  (contents of web-next/dist)
#   API/MCP    -> rdm serve on 127.0.0.1:8765
#
# Start the backend with RDM_PUBLIC_BASE_URL set to this server's origin, e.g.
#   RDM_PUBLIC_BASE_URL=https://rdm.example.com uv run rdm serve
# The public origin must be HTTPS and have no path (OAuth issuer / redirect
# URIs / generated links all derive from it).

server {
    listen 443 ssl;
    server_name rdm.example.com;

    # ssl_certificate     /etc/ssl/rdm/fullchain.pem;
    # ssl_certificate_key /etc/ssl/rdm/privkey.pem;

    root /srv/rdm/web-next;
    index index.html;

    # 20 MB attachment cap + multipart overhead.
    client_max_body_size 25m;

    # --- SPA ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Never cache the shell: it references content-hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- API ---------------------------------------------------------------
    # Owner recovery is loopback-only by contract; a reverse proxy also
    # connects from loopback, so block it at the edge (§17.160).
    location ^~ /api/v1/local/ {
        return 404;
    }

    # Covers /api/v1, /api/oauth, /api/healthz and /api/docs.
    # NOTE: proxy_pass has no URI (no trailing slash), so /api is preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Server-sent events (notifications). Must not be buffered.
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- MCP ---------------------------------------------------------------
    location /mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- OAuth discovery ---------------------------------------------------
    # RFC 8414/9728 require these at the origin root, not under /api.
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Transitional legacy OAuth paths ----------------------------------
    # Cached old bundles may still call /authorize etc.; Python answers 308
    # to /api/oauth/*. Remove this block after one deployment cycle.
    location ~ ^/(authorize|token|register|revoke)$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
