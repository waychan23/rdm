version: 2
kinds:
  epic:
    states: [TODO, IN_PROGRESS, DONE, CANCELLED]
    initial: TODO
    terminal: [DONE, CANCELLED]
    transitions:
      TODO: [IN_PROGRESS, CANCELLED]
      IN_PROGRESS: [DONE, CANCELLED]
      DONE: []
      CANCELLED: []
    gates:
      DONE: {children_all_terminal: true}

  story:
    states: [TODO, IN_PROGRESS, BLOCKED, TO_TEST, DONE, PUBLISHED, CANCELLED]
    initial: TODO
    terminal: [DONE, PUBLISHED, CANCELLED]
    transitions:
      TODO: [IN_PROGRESS, CANCELLED]
      IN_PROGRESS: [TO_TEST, BLOCKED, CANCELLED]
      BLOCKED: [IN_PROGRESS, TODO, CANCELLED]
      TO_TEST: [DONE, IN_PROGRESS, CANCELLED]
      DONE: [PUBLISHED]
      PUBLISHED: []
      CANCELLED: []
    gates:
      DONE: {children_all_terminal: true}
      PUBLISHED: {children_all_terminal: true}

  issue:
    states: [OPEN, TO_CONFIRM, TO_FIX, FIXING, BLOCKED, CLOSED_DONE, CLOSED_REJECTED, REOPEN, CANCELLED]
    initial: OPEN
    terminal: [CLOSED_DONE, CLOSED_REJECTED, CANCELLED]
    transitions:
      OPEN: [TO_CONFIRM, CANCELLED]
      TO_CONFIRM: [TO_FIX, CLOSED_REJECTED, CANCELLED]
      TO_FIX: [FIXING, BLOCKED, CANCELLED]
      FIXING: [TO_FIX, BLOCKED, CLOSED_DONE, CANCELLED]
      BLOCKED: [TO_FIX, FIXING, CANCELLED]
      REOPEN: [TO_FIX, FIXING, CLOSED_DONE, CANCELLED]
      CLOSED_DONE: [REOPEN]
      CLOSED_REJECTED: [REOPEN]
      CANCELLED: []
    gates:
      CLOSED_DONE: {children_all_terminal: true, min_children: 1}

  task:
    states: [TODO, IN_PROGRESS, BLOCKED, TO_REVIEW, DONE, PUBLISHED, CANCELLED]
    initial: TODO
    terminal: [DONE, PUBLISHED, CANCELLED]
    transitions:
      TODO: [IN_PROGRESS, CANCELLED]
      IN_PROGRESS: [TO_REVIEW, BLOCKED, CANCELLED]
      BLOCKED: [IN_PROGRESS, TODO, CANCELLED]
      TO_REVIEW: [DONE, IN_PROGRESS, CANCELLED]
      DONE: [PUBLISHED]
      PUBLISHED: []
      CANCELLED: []
    gates: {}

  sprint:
    states: [PLANNED, ACTIVE, CLOSED]
    initial: PLANNED
    terminal: [CLOSED]
    transitions:
      PLANNED: [ACTIVE]
      ACTIVE: [CLOSED]
      CLOSED: []
    gates:
      CLOSED: {no_nonterminal_sprint_items: true}
